<svg width="680" height="420" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AVA — Autonomous Value Advisory</title>
  <desc>A bold, geometric logo for the AVA internal project featuring a stylized hexagonal emblem with data flow motifs and the AVA wordmark.</desc>
  <defs>
    <style>
      .bg-card { fill: transparent; }
      .hex-bg { fill: #F1EEF9; }
      .wordmark { fill: #26215C; }
      .tagline { fill: #534AB7; }
      .ring-outer { stroke: #AFA9EC; }
      .ring-mid { stroke: #7F77DD; }
      .dot-accent { fill: #534AB7; }
      .orbit-line { stroke: #CECBF6; }
      .letter-a { fill: #534AB7; }
      .letter-center { fill: #7F77DD; }
      .inner-glow { fill: #EEEDFE; }
      .node-dot { fill: #7F77DD; }
      .connector { stroke: #AFA9EC; }
      .tag-bg { fill: #EEEDFE; }
      .tag-text { fill: #3C3489; }
      .badge-bg { fill: #E1F5EE; }
      .badge-text { fill: #0F6E56; }
    </style>
  </defs>

  <!-- Hexagon emblem -->
  <polygon points="200,60 260,95 260,165 200,200 140,165 140,95" class="hex-bg" stroke-width="0"/>

  <!-- Orbit rings -->
  <circle cx="200" cy="130" r="60" class="ring-outer" fill="none" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.6"/>
  <circle cx="200" cy="130" r="44" class="ring-mid" fill="none" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5"/>

  <!-- Inner hex shape -->
  <polygon points="200,78 238,100 238,144 200,166 162,144 162,100" class="inner-glow"/>

  <!-- Connector lines from center to nodes -->
  <line x1="200" y1="130" x2="200" y2="78" class="connector" stroke-width="0.8" fill="none"/>
  <line x1="200" y1="130" x2="238" y2="100" class="connector" stroke-width="0.8" fill="none"/>
  <line x1="200" y1="130" x2="238" y2="144" class="connector" stroke-width="0.8" fill="none"/>
  <line x1="200" y1="130" x2="200" y2="166" class="connector" stroke-width="0.8" fill="none"/>
  <line x1="200" y1="130" x2="162" y2="144" class="connector" stroke-width="0.8" fill="none"/>
  <line x1="200" y1="130" x2="162" y2="100" class="connector" stroke-width="0.8" fill="none"/>

  <!-- Node dots on hex vertices -->
  <circle cx="200" cy="78" r="4" class="node-dot"/>
  <circle cx="238" cy="100" r="4" class="node-dot"/>
  <circle cx="238" cy="144" r="4" class="node-dot"/>
  <circle cx="200" cy="166" r="4" class="node-dot"/>
  <circle cx="162" cy="144" r="4" class="node-dot"/>
  <circle cx="162" cy="100" r="4" class="node-dot"/>

  <!-- Central A letterform -->
  <polygon points="200,92 224,140 176,140" class="letter-a" opacity="0.9"/>
  <polygon points="200,108 214,134 186,134" class="inner-glow"/>
  <rect x="189" y="126" width="22" height="3.5" class="inner-glow"/>

  <!-- Center dot -->
  <circle cx="200" cy="130" r="3.5" class="dot-accent"/>

  <!-- Outer hex border -->
  <polygon points="200,60 260,95 260,165 200,200 140,165 140,95" fill="none" class="ring-mid" stroke-width="1.2"/>

  <!-- Wordmark: AVA -->
  <text x="290" y="118" class="wordmark" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">AVA</text>

  <!-- Dot accent on wordmark -->
  <circle cx="290" cy="126" r="3" class="dot-accent"/>

  <!-- Full name -->
  <text x="291" y="148" class="tagline" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="2">AUTONOMOUS VALUE ADVISORY</text>

  <!-- Divider line -->
  <line x1="291" y1="162" x2="520" y2="162" class="ring-mid" stroke-width="0.5" fill="none"/>

  <!-- Tagline description -->
  <text x="291" y="178" class="tagline" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" opacity="0.75">SAP solution intelligence, instantly synthesized</text>

  <!-- Tech badges -->
  <rect x="291" y="194" width="52" height="18" rx="3" class="tag-bg"/>
  <text x="317" y="207" class="tag-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">MCP</text>

  <rect x="351" y="194" width="64" height="18" rx="3" class="tag-bg"/>
  <text x="383" y="207" class="tag-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">HANA Cloud</text>

  <rect x="423" y="194" width="46" height="18" rx="3" class="badge-bg"/>
  <text x="446" y="207" class="badge-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Joule</text>

  <!-- Bottom data flow pipeline -->
  <g transform="translate(140, 248)">
    <!-- Pain point lib node -->
    <rect x="0" y="0" width="110" height="36" rx="4" class="tag-bg"/>
    <text x="55" y="14" class="tag-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Pain point library</text>
    <text x="55" y="27" class="tagline" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="middle" opacity="0.7">vector index</text>

    <!-- Arrow -->
    <line x1="116" y1="18" x2="134" y2="18" class="connector" stroke-width="1" fill="none"/>
    <polygon points="130,15 136,18 130,21" class="node-dot"/>

    <!-- AVA engine node -->
    <rect x="140" y="0" width="90" height="36" rx="4" class="inner-glow" stroke-width="1"/>
    <polygon points="185,7 197,30 173,30" class="letter-a" opacity="0.8"/>
    <polygon points="185,15 193,28 177,28" class="inner-glow"/>
    <rect x="179" y="24" width="12" height="2.5" class="inner-glow"/>

    <!-- Arrow -->
    <line x1="236" y1="18" x2="254" y2="18" class="connector" stroke-width="1" fill="none"/>
    <polygon points="250,15 256,18 250,21" class="node-dot"/>

    <!-- Roadmap KB node -->
    <rect x="260" y="0" width="110" height="36" rx="4" class="tag-bg"/>
    <text x="315" y="14" class="tag-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Roadmap + KPIs</text>
    <text x="315" y="27" class="tagline" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="middle" opacity="0.7">knowledge base</text>

    <!-- Arrow down to output -->
    <line x1="185" y1="36" x2="185" y2="54" class="connector" stroke-width="0.8" fill="none" stroke-dasharray="3 2"/>
    <polygon points="182,51 185,57 188,51" class="node-dot"/>

    <!-- Output node -->
    <rect x="120" y="58" width="130" height="28" rx="4" class="badge-bg"/>
    <text x="185" y="77" class="badge-text" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">Excel output — ready</text>
  </g>
</svg>
