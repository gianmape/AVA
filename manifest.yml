---
applications:
  - name: ava
    command: python server/server_cf.py --http --port $PORT
    buildpacks:
      - python_buildpack
    memory: 512M
    disk_quota: 1G
    instances: 1
    routes:
      - route: ava.cfapps.us30.hana.ondemand.com
    env:
      # Caller guard — rejects requests that bypass SAP BTP routing entirely.
      # "enforce": reject non-BTP requests with 403 (production)
      # "log":     allow all but log failures (safe rollout / validation)
      # "off":     disabled (emergency only)
      AVA_GUARD: "enforce"
      # Rate limiting — token bucket per client IP (protects against external abuse).
      # AVA_RATE_BURST: max requests allowed in a burst (default 20)
      # AVA_RATE_PER_MINUTE: sustained requests per minute (default 10)
      AVA_RATE_BURST: "20"
      AVA_RATE_PER_MINUTE: "10"
      AICORE_RESOURCE_GROUP: default
      EMBEDDING_MODEL_NAME: gemini-embedding
      HANA_PORT: "443"
      HANA_SCHEMA: SVA2
      # Secrets — set once with cf set-env (do not add values here):
      #   cf set-env ava AICORE_AUTH_URL           <value>
      #   cf set-env ava AICORE_BASE_URL           <value>
      #   cf set-env ava AICORE_CLIENT_ID          <value>
      #   cf set-env ava AICORE_CLIENT_SECRET      <value>
      #   cf set-env ava EMBEDDING_DEPLOYMENT_ID   <value>
      #   cf set-env ava HANA_HOST                 <value>
      #   cf set-env ava HANA_USER                 <value>
      #   cf set-env ava HANA_PASSWORD             <value>